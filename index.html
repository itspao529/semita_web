<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Semita - Control de giro con sensor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Encabezado -->
  <header class="barra text-center py-4">
    <img src="img/barca.png" alt="Escudo F.C. Barcelona" class="escudo mb-2">
    <h1 class="h3 mb-0">Control de giro con sensor</h1>
    <small>EAI441 · semita.sv</small>
  </header>

  <main class="container my-4">

    <!-- Integrantes -->
    <section class="text-center mb-4">
      <h2 class="h5 mb-3">Integrantes</h2>
      <div class="row g-3 justify-content-center">
        <div class="col-6 col-md-3">
          <img src="img/paola.jpg" class="foto" alt="Integrante 1">
          <p class="mt-2 fw-semibold">Paola Castillo</p>
        </div>
        <div class="col-6 col-md-3">
          <img src="img/pris.jpeg" class="foto" alt="Integrante 2">
          <p class="mt-2 fw-semibold">Priscila Gamez</p>
        </div>
        <div class="col-6 col-md-3">
          <img src="img/Gaby.jpeg" class="foto" alt="Integrante 3">
          <p class="mt-2 fw-semibold">Gabriela Vasquez</p>
        </div>
      </div>
    </section>

    <div class="row g-4">

      <!-- Panel de control -->
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body text-center">
            <h2 class="h5">Modo de operación</h2>
            <div class="btn-group mb-4" role="group">
              <button id="btnManual" class="btn btn-outline-primary">Manual</button>
              <button id="btnAuto" class="btn btn-outline-success">Automático</button>
            </div>

            <h2 class="h5">Control del motor</h2>
            <div class="d-grid gap-2">
              <button id="btnIzq" class="btn btn-primary btn-lg">⬅ Izquierda</button>
              <button id="btnDer" class="btn btn-primary btn-lg">Derecha ➡</button>
              <button id="btnStop" class="btn btn-danger btn-lg">⏹ Detener</button>
            </div>
            <p id="aviso" class="text-muted small mt-3 mb-0"></p>
          </div>
        </div>
      </div>

      <!-- Panel de lecturas -->
      <div class="col-md-6">
        <div class="card shadow-sm h-100">
          <div class="card-body text-center">
            <h2 class="h5">Distancia detectada</h2>
            <div class="display">
              <span id="distancia">---</span> <small class="unidad">cm</small>
            </div>

            <h2 class="h5 mt-4">Estado actual</h2>
            <p>Modo: <span id="modoActual" class="badge bg-secondary badge-estado">---</span></p>
            <p>Motor: <span id="motorActual" class="badge bg-secondary badge-estado">---</span></p>
            <p id="conexion" class="small text-muted mb-0">Conectando con la API...</p>
          </div>
        </div>
      </div>

    </div>
  </main>

  <footer class="text-center text-muted small pb-4">
    <img src="img/barca.png" alt="Escudo del Barcelona" height="40"><br>
    Proyecto EAI441 · Éxodo 15:3
  </footer>

  <script src="js/app.js"></script>
  <script src="js/efectos.js"></script>
</body>
</html>
